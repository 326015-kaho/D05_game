<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-3 select-none">

  <!-- ヘッダーエリア -->
  <header class="w-full max-w-md flex justify-between items-center py-2 px-4 bg-slate-800/80 rounded-xl backdrop-blur border border-slate-700 mb-2">
    <div class="flex items-center space-x-2">
      <span class="text-2xl">🐟</span>
      <div>
        <p class="text-xs text-slate-400">集めた魚</p>
        <p id="scoreText" class="text-xl font-bold text-yellow-400">0 匹</p>
      </div>
    </div>
    <div class="text-right">
      <p class="text-xs text-slate-400">ハイスコア</p>
      <p id="highScoreText" class="text-lg font-semibold text-slate-200">0 匹</p>
    </div>
  </header>

  <!-- ゲーム画面エリア -->
  <main class="relative w-full max-w-md flex-1 flex flex-col items-center justify-center">
    <canvas id="gameCanvas" width="360" height="480" class="rounded-2xl border-2 border-cyan-500/30 w-full max-w-md h-auto aspect-[3/4]"></canvas>

    <!-- スタート / ゲームオーバーの案内メッセージ -->
    <div id="overlay" class="absolute inset-0 bg-slate-950/85 rounded-2xl flex flex-col items-center justify-center p-5 text-center backdrop-blur-sm z-10">
      <h1 id="overlayTitle" class="text-2xl font-extrabold text-cyan-400 mb-2">サメから逃げろ！<br>魚あつめ</h1>
      
      <!-- 現在のスピードメーター表示 -->
      <div class="bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700 mb-3 text-xs text-cyan-300">
        現在の移動スピード: <span id="speedDisplay" class="font-bold text-yellow-400 text-sm">1.2</span> (激おそ)
      </div>

      <p id="overlayMessage" class="text-xs text-slate-300 mb-4 leading-relaxed">
        指や矢印キーでプレイヤー（🐟）を動かそう！<br>
        最初は<b>かなりゆっくり</b>だけど、生き物を食べるほど加速！<br>
        生き物（🐡+0.15 / 🐠+0.30 / 🦑+0.50 / 🦐+0.80）で加速が変わるよ！<br>
        右下の暗闇にある岩陰（🪨）を目指して逃げ切ろう！
      </p>

      <div class="w-full max-w-xs space-y-2">
        <button id="startButton" class="w-full py-3 px-6 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg transform active:scale-95 transition-all text-base">
          ゲームをはじめる
        </button>
        
        <!-- コードコピー用ボタン -->
        <button id="copyCodeButton" class="w-full py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-600 font-medium rounded-lg text-xs flex items-center justify-center gap-1.5 transition-all">
          <span>📋</span> <span>HTMLコードをコピー</span>
        </button>
      </div>
    </div>

    <!-- コピー完了通知トースト -->
    <div id="toast" class="hidden absolute top-4 bg-emerald-600 text-white text-xs px-4 py-2 rounded-lg shadow-lg font-bold border border-emerald-400 z-20 animate-bounce">
      ✅ コードをクリップボードにコピーしました！
    </div>
  </main>

  <!-- スマホ用コントローラー（画面下部） -->
  <footer class="w-full max-w-md my-2">
    <div class="bg-slate-800/50 rounded-xl p-2 border border-slate-700/50 flex flex-col items-center">
      <p class="text-xs text-slate-400 mb-1">画面ドラッグ または 下のボタンで移動</p>
      <div class="grid grid-cols-3 gap-2 w-48">
        <div></div>
        <button id="btnUp" class="bg-slate-700 active:bg-cyan-600 p-3 rounded-lg text-xl flex justify-center items-center shadow select-none">▲</button>
        <div></div>
        <button id="btnLeft" class="bg-slate-700 active:bg-cyan-600 p-3 rounded-lg text-xl flex justify-center items-center shadow select-none">◄</button>
        <button id="btnDown" class="bg-slate-700 active:bg-cyan-600 p-3 rounded-lg text-xl flex justify-center items-center shadow select-none">▼</button>
        <button id="btnRight" class="bg-slate-700 active:bg-cyan-600 p-3 rounded-lg text-xl flex justify-center items-center shadow select-none">►</button>
      </div>
    </div>
  </footer>

  <script>
    // キャンバスと2Dコンテキストの設定
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI要素の取得
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayMessage = document.getElementById('overlayMessage');
    const speedDisplay = document.getElementById('speedDisplay');
    const startButton = document.getElementById('startButton');
    const copyCodeButton = document.getElementById('copyCodeButton');
    const toast = document.getElementById('toast');

    // ゲーム状態変数
    let isPlaying = false;
    let score = 0;
    let highScore = 0;
    let animationId = null;

    // 広大なワールドマップのサイズ設定
    const MAP_WIDTH = 1000;
    const MAP_HEIGHT = 1200;

    // カメラ位置（スクロール用）
    const camera = {
      x: 0,
      y: 0
    };

    // 初期スピードの設定（1.2＝明確に超ゆっくり移動）
    const INITIAL_PLAYER_SPEED = 1.2;

    // プレイヤー（自分の魚）の設定（スタート位置：左上）
    const player = {
      x: 100,
      y: 100,
      size: 24,
      speed: INITIAL_PLAYER_SPEED,
      targetX: 100,
      targetY: 100
    };

    // 出現する小魚・海の生き物の種類（4種類：それぞれ加速の度が異なる）
    const FISH_TYPES = [
      { emoji: '🐡', name: 'フグ',   speedBoost: 0.15, size: 20 }, // ほんのり加速
      { emoji: '🐠', name: '熱帯魚', speedBoost: 0.30, size: 18 }, // 普通加速
      { emoji: '🦑', name: 'イカ',   speedBoost: 0.50, size: 18 }, // ぐんと加速
      { emoji: '🦐', name: 'エビ',   speedBoost: 0.80, size: 16 }  // 猛スピードで大加速！
    ];

    // サメ（敵）の設定
    const shark = {
      x: 350,
      y: 350,
      size: 36,
      speed: 0.8
    };

    // ゴール（岩陰）の設定（見えにくい右下の遠い場所に配置）
    const goal = {
      x: MAP_WIDTH - 80,
      y: MAP_HEIGHT - 80,
      size: 32
    };

    // 集めるターゲット（小魚）のリスト
    let fishes = [];
    const MAX_FISHES = 7;

    // 海の泡エフェクト（背景装飾）
    let bubbles = [];
    for (let i = 0; i < 30; i++) {
      bubbles.push({
        x: Math.random() * MAP_WIDTH,
        y: Math.random() * MAP_HEIGHT,
        radius: Math.random() * 4 + 1,
        speed: Math.random() * 1 + 0.5
      });
    }

    // キーボード入力の状態管理
    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false
    };

    // キーボードイベント処理
    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = true;
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = false;
      }
    });

    // タッチ・マウスによる移動処理（キャンバス座標 -> ワールド座標へ変換）
    function handlePointerMove(clientX, clientY) {
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      player.targetX = canvasX + camera.x;
      player.targetY = canvasY + camera.y;
    }

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) { // 左クリックしながら移動
        handlePointerMove(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // スマホ用オンスクリーンボタンの長押し設定
    function setupButtonControl(id, keyName) {
      const btn = document.getElementById(id);
      const start = (e) => { e.preventDefault(); keys[keyName] = true; };
      const end = (e) => { e.preventDefault(); keys[keyName] = false; };

      btn.addEventListener('touchstart', start);
      btn.addEventListener('touchend', end);
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
    }

    setupButtonControl('btnUp', 'ArrowUp');
    setupButtonControl('btnDown', 'ArrowDown');
    setupButtonControl('btnLeft', 'ArrowLeft');
    setupButtonControl('btnRight', 'ArrowRight');

    // 小魚をマップのランダム位置に生み出す（4種類からランダム決定）
    function spawnFish() {
      const randomType = FISH_TYPES[Math.floor(Math.random() * FISH_TYPES.length)];
      fishes.push({
        x: Math.random() * (MAP_WIDTH - 80) + 40,
        y: Math.random() * (MAP_HEIGHT - 80) + 40,
        type: randomType,
        size: randomType.size
      });
    }

    // スピード表示のテキスト更新
    function updateSpeedDisplay() {
      const spd = player.speed.toFixed(2);
      let desc = "激おそ";
      if (player.speed >= 6.0) desc = "超高速！";
      else if (player.speed >= 4.0) desc = "かなり速い！";
      else if (player.speed >= 2.5) desc = "ふつう";
      else if (player.speed >= 1.8) desc = "少し加速";

      speedDisplay.textContent = spd;
      speedDisplay.nextSibling.textContent = ` (${desc})`;
    }

    // ゲーム開始時の初期化
    function startGame() {
      score = 0;
      scoreText.textContent = `${score} 匹`;

      // プレイヤーの初期化（超ゆっくりスタート）
      player.x = 100;
      player.y = 100;
      player.speed = INITIAL_PLAYER_SPEED;
      player.targetX = player.x;
      player.targetY = player.y;

      updateSpeedDisplay();

      // サメの初期化
      shark.x = 350;
      shark.y = 350;
      shark.speed = 0.8;

      // カメラのリセット
      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;

      // ターゲット小魚の生成
      fishes = [];
      for (let i = 0; i < MAX_FISHES; i++) {
        spawnFish();
      }

      isPlaying = true;
      overlay.classList.add('hidden');

      if (animationId) cancelAnimationFrame(animationId);
      gameLoop();
    }

    // ゲームオーバー処理
    function gameOver() {
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        highScoreText.textContent = `${highScore} 匹`;
      }

      overlayTitle.textContent = "ゲームオーバー！";
      overlayMessage.innerHTML = `サメにつかまってしまいました...<br>今回集めた魚: <span class="text-xl font-bold text-yellow-400">${score} 匹</span><br>最終到達スピード: <span class="font-bold text-cyan-300">${player.speed.toFixed(2)}</span>`;
      startButton.textContent = "もう一度あそぶ";
      overlay.classList.remove('hidden');
    }

    // ゲームクリア処理
    function gameClear() {
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        highScoreText.textContent = `${highScore} 匹`;
      }

      overlayTitle.textContent = "🎉 ゴール成功！クリア！";
      overlayMessage.innerHTML = `無事に右下の岩陰（🪨）へ逃げ込めました！<br>集めた魚: <span class="text-xl font-bold text-yellow-400">${score} 匹</span><br>最終移動スピード: <span class="font-bold text-cyan-300">${player.speed.toFixed(2)}</span>`;
      startButton.textContent = "もう一度あそぶ";
      overlay.classList.remove('hidden');
    }

    // 位置更新および当たり判定ロジック
    function update() {
      if (!isPlaying) return;

      // キーボード操作による移動ベクトル計算
      let kx = 0;
      let ky = 0;
      if (keys.ArrowUp) ky -= 1;
      if (keys.ArrowDown) ky += 1;
      if (keys.ArrowLeft) kx -= 1;
      if (keys.ArrowRight) kx += 1;

      if (kx !== 0 || ky !== 0) {
        // キーボード操作：player.speed をダイレクトに反映
        const len = Math.hypot(kx, ky);
        player.x += (kx / len) * player.speed;
        player.y += (ky / len) * player.speed;
        player.targetX = player.x;
        player.targetY = player.y;
      } else {
        // タッチ / ドラッグ操作：距離に向かって player.speed の歩幅で移動（これでスピードが正しく機能します）
        const dx = player.targetX - player.x;
        const dy = player.targetY - player.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 2) {
          const moveStep = Math.min(dist, player.speed);
          player.x += (dx / dist) * moveStep;
          player.y += (dy / dist) * moveStep;
        }
      }

      // マップ外へ出ないよう制限
      player.x = Math.max(player.size / 2, Math.min(MAP_WIDTH - player.size / 2, player.x));
      player.y = Math.max(player.size / 2, Math.min(MAP_HEIGHT - player.size / 2, player.y));

      // カメラ位置の更新（プレイヤー追尾）
      camera.x = player.x - canvas.width / 2;
      camera.y = player.y - canvas.height / 2;
      camera.x = Math.max(0, Math.min(MAP_WIDTH - canvas.width, camera.x));
      camera.y = Math.max(0, Math.min(MAP_HEIGHT - canvas.height, camera.y));

      // サメ（敵）のゆっくり追尾
      const angle = Math.atan2(player.y - shark.y, player.x - shark.x);
      shark.x += Math.cos(angle) * shark.speed;
      shark.y += Math.sin(angle) * shark.speed;

      // 小魚（ターゲット）の獲得判定とスピードアップ処理
      for (let i = fishes.length - 1; i >= 0; i--) {
        const fish = fishes[i];
        const dist = Math.hypot(player.x - fish.x, player.y - fish.y);

        if (dist < (player.size / 2 + fish.size / 2)) {
          score++;
          scoreText.textContent = `${score} 匹`;

          // 食べた生き物の種類に応じてプレイヤーが加速！
          player.speed += fish.type.speedBoost;
          player.speed = Math.min(player.speed, 8.0); // 最高速度の上限

          updateSpeedDisplay();

          fishes.splice(i, 1);
          spawnFish();

          // サメのスピードもほんの少しだけ追従
          shark.speed = 0.8 + Math.min(score * 0.03, 1.2);
        }
      }

      // サメ（敵）との衝突判定
      const distToShark = Math.hypot(player.x - shark.x, player.y - shark.y);
      if (distToShark < (player.size / 2 + shark.size / 3)) {
        gameOver();
      }

      // ゴール（岩陰）への到達判定
      const distToGoal = Math.hypot(player.x - goal.x, player.y - goal.y);
      if (distToGoal < (player.size / 2 + goal.size / 2)) {
        gameClear();
      }

      // 背景の泡アニメーション更新
      bubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < -10) {
          b.y = MAP_HEIGHT + 10;
          b.x = Math.random() * MAP_WIDTH;
        }
      });
    }

    // キャンバス描画処理
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      // 海底の格子模様
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 2;
      for (let x = 0; x < MAP_WIDTH; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, MAP_HEIGHT);
        ctx.stroke();
      }
      for (let y = 0; y < MAP_HEIGHT; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(MAP_WIDTH, y);
        ctx.stroke();
      }

      // マップの外枠線を描画
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
      ctx.lineWidth = 6;
      ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

      // 背景の泡を描画
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      bubbles.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // ゴール（岩陰）の描画
      ctx.font = '36px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🪨', goal.x, goal.y);
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#67e8f9';
      ctx.fillText('GOAL', goal.x, goal.y - 24);

      // ターゲット（生き物）の描画
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      fishes.forEach(f => {
        ctx.fillText(f.type.emoji, f.x, f.y);
      });

      // サメの描画（進行方向によって反転）
      ctx.font = '32px sans-serif';
      ctx.save();
      ctx.translate(shark.x, shark.y);
      if (player.x < shark.x) {
        ctx.scale(-1, 1);
      }
      ctx.fillText('🦈', 0, 0);
      ctx.restore();

      // プレイヤー（自分の魚）の描画
      ctx.font = '28px sans-serif';
      ctx.save();
      ctx.translate(player.x, player.y);
      if (player.targetX < player.x || keys.ArrowLeft) {
        ctx.scale(-1, 1);
      }
      ctx.fillText('🐟', 0, 0);
      ctx.restore();

      ctx.restore();
    }

    // メインループ
    function gameLoop() {
      update();
      draw();
      if (isPlaying) {
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    // イベントリスナー設定
    startButton.addEventListener('click', startGame);

    // HTMLコードをクリップボードにコピーする関数
    copyCodeButton.addEventListener('click', () => {
      const sourceCode = document.documentElement.outerHTML;
      
      // テキストエリアをテンポラリで作成してコピー実行
      const textArea = document.createElement('textarea');
      textArea.value = sourceCode;
      document.body.appendChild(textArea);
      textArea.select();
      
      try {
        document.execCommand('copy');
        // トースト通知を表示
        toast.classList.remove('hidden');
        setTimeout(() => {
          toast.classList.add('hidden');
        }, 3000);
      } catch (err) {
        console.error('コピーに失敗しました', err);
      } finally {
        document.body.removeChild(textArea);
      }
    });

    // 初期状態の描画
    draw();
  </script>

</body></html>
